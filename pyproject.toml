[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dlproject"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "matplotlib",
    "pillow",
    "gdown",
    "torchinfo",
    "torchmetrics",
]

[tool.setuptools.packages.find]
where = ["src"]
